<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Votre devis</title>
</head>
<body style="margin:0; padding:0; background-color:#f4f4f4; font-family:Helvetica, Arial, sans-serif;">

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f4; padding:24px 0;">
    <tr>
        <td align="center">

            <table role="presentation" width="100%" style="max-width:600px; background-color:#ffffff; border-radius:8px; overflow:hidden;" cellpadding="0" cellspacing="0">

                <tr>
                    <td style="background-color:#3B82F6; padding:20px 32px;">
                        <span style="color:#ffffff; font-size:18px; font-weight:bold;" th:text="${companyName}"></span>
                    </td>
                </tr>

                <tr>
                    <td style="padding:32px; color:#1a1a1a; font-size:14px; line-height:1.6;">

                        <p style="margin:0 0 16px 0;">
                            Bonjour <span th:text="${clientName}"></span>,
                        </p>

                        <p style="margin:0 0 16px 0;">
                            Veuillez trouver ci-joint votre devis
                            <strong th:text="${quoteNumber}"></strong>.
                        </p>

                        <p style="margin:0 0 16px 0;">
                            Celui-ci est valable jusqu'au
                            <strong th:text="${validUntil}"></strong>.
                        </p>

                        <p style="margin:0 0 16px 0;">
                            Nous restons à votre disposition pour toute question complémentaire.
                        </p>

                        <p style="margin:24px 0 0 0;">
                            Cordialement,<br />
                            <strong th:text="${companyName}"></strong>
                        </p>

                    </td>
                </tr>

            </table>

        </td>
    </tr>
</table>

</body>
</html>
