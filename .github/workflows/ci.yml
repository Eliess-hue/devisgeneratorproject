name: CI Pipeline

on:
  push:
    branches: [ main ]

  pull_request:
    branches: [ main ]

jobs:

  test-backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17

        env:
          POSTGRES_DB: devis_db
          POSTGRES_USER: devis_user
          POSTGRES_PASSWORD: dev1sUs3r

        ports:
          - 5432:5432

        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Run tests
        working-directory: ./devisgenerator
        run: ./mvnw test
        env:
          SPRING_PROFILES_ACTIVE: test
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/devis_db
          SPRING_DATASOURCE_USERNAME: devis_user
          SPRING_DATASOURCE_PASSWORD: dev1sUs3r
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRATION: ${{ secrets.JWT_EXPIRATION }}

  build-backend:
    runs-on: ubuntu-latest

    needs: test-backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build backend Docker image
        run: docker build -t devis-backend ./devisgenerator

  build-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: devisgenerator-frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./devisgenerator-frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./devisgenerator-frontend
        run: npm run build

      - name: Build frontend Docker image
        run: docker build -t devis-frontend ./devisgenerator-frontend