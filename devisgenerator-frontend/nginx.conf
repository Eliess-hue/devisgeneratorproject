server {

    listen 80;

    location / {

        root /usr/share/nginx/html;
        index index.html;

        try_files $uri $uri/ /index.html;

    }

    location /api/ {

        proxy_pass http://backend:8080;
        resolver 127.0.0.11 valid=30s;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;

    }

}